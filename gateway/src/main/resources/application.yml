server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: car-service
              uri: http://car-service:8081
              predicates:
                - Path=/api/cars/**
            - id: report-service
              uri: http://report-service:8082
              predicates:
                - Path=/api/reports/**
