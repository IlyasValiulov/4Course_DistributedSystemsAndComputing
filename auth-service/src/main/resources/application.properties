
spring.application.name=auth-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car_rental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.database-change-log-table=AUTH_DATABASECHANGELOG
spring.liquibase.database-change-log-lock-table=AUTH_DATABASECHANGELOGLOCK

logging.level.root=INFO
logging.logstash.host=${LOGSTASH_HOST:localhost}
logging.logstash.port=${LOGSTASH_PORT:5000}

jwt.issuer=car-rental-auth
jwt.access-token-ttl=1800
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:./secrets/private.pem}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/public.pem}
